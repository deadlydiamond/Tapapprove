name: Tapapprove
options:
  createIntermediateGroups: true
  deploymentTarget:
    watchOS: "10.0"
    iOS: "17.0"
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
targets:
  # Apple only takes a watch app inside an iPhone app, even when nothing runs on the iPhone.
  # This holds no code. Archive it with the TapapproveStore scheme to reach App Store Connect.
  TapapproveStore:
    type: application.watchapp2-container
    platform: iOS
    dependencies:
      - target: Tapapprove
    settings:
      base:
        PRODUCT_NAME: Tapapprove
        PRODUCT_BUNDLE_IDENTIFIER: $(TAPAPPROVE_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: NO
  Tapapprove:
    type: application
    platform: watchOS
    sources:
      - path: Tapapprove
        excludes:
          - "Info*.plist"
    dependencies:
      - target: TapapproveWidget
      - target: TapapproveNotify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAPAPPROVE_WATCH_BUNDLE_ID)
        INFOPLIST_FILE: Tapapprove/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(TAPAPPROVE_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Also colors the app's name on its notifications.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
      configs:
        # Debug alone may talk to http://localhost, so Release can never ship that exception.
        Debug:
          INFOPLIST_FILE: Tapapprove/Info-Debug.plist
  TapapproveWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: TapapproveWidget
      # The widget shares the app's brand color.
      - path: Tapapprove/Assets.xcassets
    info:
      path: TapapproveWidget/Info.plist
      properties:
        CFBundleDisplayName: Tapapprove
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAPAPPROVE_WATCH_BUNDLE_ID).widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
  TapapproveNotify:
    type: app-extension
    platform: watchOS
    sources:
      - path: TapapproveNotify
        excludes:
          - "Info.plist"
      # Opens the sealed preview with the keys the app saved.
      - path: Tapapprove/ChannelCrypto.swift
      - path: Tapapprove/SealedPreview.swift
      - path: Tapapprove/TokenStore.swift
      - path: Tapapprove/SharedTypes.swift
    info:
      path: TapapproveNotify/Info.plist
      properties:
        CFBundleDisplayName: Tapapprove
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TapapproveAppBundleID: $(TAPAPPROVE_WATCH_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAPAPPROVE_WATCH_BUNDLE_ID).notify
        CODE_SIGN_ENTITLEMENTS: TapapproveNotify/TapapproveNotify.entitlements
        SKIP_INSTALL: YES
  TapapproveTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: TapapproveTests
    dependencies:
      - target: Tapapprove
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAPAPPROVE_WATCH_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  TapapproveUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: TapapproveUITests
    dependencies:
      - target: Tapapprove
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAPAPPROVE_WATCH_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TapapproveStore:
    build:
      targets:
        TapapproveStore: all
    archive:
      config: Release
  Tapapprove:
    build:
      targets:
        Tapapprove: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TapapproveTests
        - TapapproveUITests
